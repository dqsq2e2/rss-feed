id: rss-feed
name: RSS Feed
version: 2.0.3
min_core_version: 2.0.0
admin_only: true
author: Ting Reader Team
description:
  zh: 通过签名公共插件路由向外部 RSS 阅读器发布当前用户可访问的馆藏更新。
  en: Publish signed RSS feeds for the books accessible to the current user.
runtime: javascript
license: MIT
repo: dqsq2e2/rss-feed
entry_point: plugin.js
capabilities:
- id: rss.panel
  kind: ui_extension
  slots:
  - app.sidebar_page
  - global.floating_action
  title:
    zh: RSS 订阅
    en: RSS Feeds
  icon: rss
  priority: 30
  render:
    mode: web_container
    entry: ui/rss.html
    bridge:
      capabilities:
      - rss.tools
      host_methods:
      - user_settings.get
  contexts:
  - global
- id: rss.book_panel
  kind: ui_extension
  title:
    zh: RSS 订阅
    en: RSS Feed
  icon: rss
  priority: 70
  render:
    mode: web_container
    entry: ui/rss.html
    bridge:
      capabilities:
      - rss.tools
      host_methods:
      - user_settings.get
  contexts:
  - book
  slots:
  - book.detail_action
- id: rss.feed
  kind: http_route
  route:
    method: GET
    path: /rss/library/{library_id}/feed.xml
    auth: signed
- id: rss.book
  kind: http_route
  route:
    method: GET
    path: /rss/book/{book_id}/feed.xml
    auth: signed
- id: rss.cover
  kind: http_route
  route:
    method: GET
    path: /rss/cover/{book_id}
    auth: signed
- id: rss.media
  kind: http_route
  route:
    method: GET
    path: /rss/media/{chapter_id}
    auth: signed
- id: rss.tools
  kind: tool_provider
  tools:
  - name: rss.state
    description:
      en: List accessible books for the RSS subscription UI.
    input_schema:
      type: object
    output_schema:
      type: object
    side_effects: false
  - name: rss.sign_book_feed
    description:
      en: Generate a signed RSS subscription URL for a selected book.
    input_schema:
      type: object
    output_schema:
      type: object
    side_effects: true
  - name: rss.disable_link
    description:
      en: Disable a generated RSS subscription URL.
    input_schema:
      type: object
    output_schema:
      type: object
    side_effects: true
  - name: rss.enable_link
    description:
      en: Re-enable a generated RSS subscription URL.
    input_schema:
      type: object
    output_schema:
      type: object
    side_effects: true
  - name: rss.delete_link
    description:
      en: Delete and revoke a generated RSS subscription URL.
    input_schema:
      type: object
    output_schema:
      type: object
    side_effects: true
  invoke: invokeTool
config_schema:
  type: object
  properties:
    public_base_url:
      type: string
      title:
        zh: 对外访问地址
        en: Public base URL
      description:
        zh: 可选。填写反向代理后的公开地址，例如 https://reader.example.com；留空时从请求头推断。
        en: Optional public origin, such as https://reader.example.com. When empty,
          it is inferred from request headers.
      placeholder: https://reader.example.com
permissions:
- type: books_read
- type: user_settings_read
- type: chapters_read
- type: media_read_url
- type: plugin_route_sign
- type: cache_read
- type: cache_write
- type: file_read
  path: .
